[workspace]
members = [
  "crates/*",
  "lichen_cli",
  # This is unused
  #    "lichen_ipc"
]
default-members = ["lichen_cli"]
resolver = "2"

[workspace.dependencies]
bitflags = "2.6.0"
color-eyre = { version = "0.6.3", features = ["issue-url"] }
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
env_logger = "0.11.5"
fs-err = { version = "3.0.0", features = ["tokio"] }
human_bytes = "0.4.3"
itertools = "0.14.0"
libc = "0.2.155"
log = "0.4.22"
nix = "0.31.2"
serde = { version = "1.0.204", features = ["derive"] }
serde_derive = "1.0.204"
serde_json = "1.0.120"
superblock = { git = "https://github.com/AerynOS/disks-rs.git", rev = "d08bc11dcfb2ad4d031e2adccb97139f9d42c2b8" }
thiserror = "2.0.3"
topology = { git = "https://github.com/AerynOS/blsforme.git", rev = "680720545303e123e47e0df07a8a85178c9f5c19" }
varlink = { version = "11.0.1" }
varlink_generator = { version = "10.1.0 " }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
semicolon_in_expressions_from_macros = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
